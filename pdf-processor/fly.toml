# fly.toml app configuration file generated for flipwhizz-pdf-processor on 2026-03-06T17:18:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'flipwhizz-pdf-processor'
primary_region = 'lhr'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
